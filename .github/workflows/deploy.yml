name: Deploy Blazor WebAssembly to Github Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish with dotnet
        run: dotnet publish --configuration Release --output build

      - name: Change base-tag in index.html from / to repo name
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"/${GITHUB_REPO_NAME}/\" />|g" build/wwwroot/index.html
        env:
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}

      - name: Add .nojekyll file
        run: touch build/wwwroot/.nojekyll

      - name: Copy index.html to 404.html for SPA routing
        run: cp build/wwwroot/index.html build/wwwroot/404.html

      - name: Commit wwwroot to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/wwwroot